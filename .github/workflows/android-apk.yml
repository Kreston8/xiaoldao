name: Build Android APK

# One universal APK, built and signed on every push that touches android/**, then published as a release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (leave empty for xiaoldao-v2.17.<run number>)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Ensure SDK platform
        run: |
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMAN" ]; then
            "$SDKMAN" --install "platforms;android-34" "build-tools;34.0.0" || true
          fi
          ls "$ANDROID_HOME/platforms"

      - name: Restore the pinned signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/xiaoldao.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/xiaoldao.p12" >> "$GITHUB_ENV"
            echo "Pinned key restored: the APK installs over previous versions."
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret, falling back to the debug key. This APK needs a clean install."
          fi

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # versionCode = 1000 + run number, so a build from this repo always updates an islandcn build.
          VERSION_CODE=$((1000 + ${{ github.run_number }}))
          gradle assembleRelease --no-daemon --stacktrace \
            -PversionCode="$VERSION_CODE" \
            -PversionName="2.17.${{ github.run_number }}"

      # Advisory only: the artifact is verified locally afterwards, this just says which key signed it.
      - name: Check the signing certificate
        continue-on-error: true
        run: |
          APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee cert.txt || true
          if grep -q "CN=Android Debug" cert.txt 2>/dev/null; then
            echo "::warning::APK is debug-signed; it cannot update an earlier pinned-key build."
          fi

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
          "dist/xiaoldao-2.17.${{ github.run_number }}.apk"
          ls -l dist
          unzip -l dist/*.apk | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: xiaoldao-apk
          path: dist/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="xiaoldao-v2.17.${{ github.run_number }}"; fi
          cat > notes.md <<'NOTES'
          ## English

          **What this build is**
          小灵岛 (xiaoldao) is a notification island for Android: a black pill at the top of the screen that opens for messages, verification codes, pickup codes, deliveries, calls, alarms and the 网易云音乐 player with line-by-line lyrics, plus a small standby pill on the home screen with the clock, the temperature and the weather. Plain Java, two overlay windows, no WebView.

          **What is new in this build**
          - **Icon, third pass.** The capsule in the middle of the launcher icon is flatter now (46×28 inside the tile), the two HUD lines that used to sit at its sides are gone, and the eyes are no longer round dots with a gradient halo: they are the same two upright pills the island itself draws, 6.6×9.6 each, 13 units apart, white with a cold rim, so the icon and the app finally agree on what the face looks like.
          - **The island now survives leaving the app.** `onTaskRemoved` — and a service destroyed while the switch is still on — queue a persisted one-shot `JobScheduler` job for 10 seconds later, next to the 15-minute watchdog, so the usual gap between "swiped the app away" and "the island is back on the launcher" is seconds instead of up to a quarter of an hour. The foreground-service notification is also marked `FOREGROUND_SERVICE_IMMEDIATE`, so the state is real from the first second — the moment vendor killers watch hardest. The 后台常驻 card gained a 打开「自启动」设置 button that jumps straight to the MIUI auto-start page (and falls back to the app page if the ROM hides it).
          - **Weather stops going blank.** A successful reading — temperature, WMO code, AQI, resolved place and coordinates, stamped with the city name and the time — is written to this device, so a killed process shows the last known number at once instead of an empty chip while it refetches; entries older than 12 hours are dropped. Coordinates are reused, so a normal refresh is one request instead of two, failures back off 90 s → 3 min → 10 min → 30 min instead of a flat 90 s, and a half answer (forecast without AQI) keeps the previous value instead of blanking it.

          **Supported systems** — Android 8.0 and newer, built against Android 14. One universal APK: plain Java, no `lib/`. Reference family: 小米 / 红米 / POCO on MIUI 12-14 or HyperOS; MIUI also needs 后台弹出界面, and for 小灵岛 to stay alive after you leave the app it needs 自启动 with an unrestricted 省电策略 — the new button in Settings opens that page. Limits worth knowing: Android 12 and newer normally forbids starting a foreground service from the background, which is why the watchdog lives in a `JobScheduler` job, why the 10-second job is a persisted one, and why opening the app also restarts the island; a 强行停止 still cancels everything, that is the system's design and nothing an app schedules survives it; 待办 cards read 小米笔记 directly and need root, because it publishes no provider; Open-Meteo's geocoder does not list every Chinese district, which is why the resolved label is printed for you to check; and an SMS card opens the conversation, not one single message. Four hosts are reached, and only when used: geocoding-api.open-meteo.com / api.open-meteo.com / air-quality-api.open-meteo.com for the typed city, music.163.com for lyrics. Permissions, limits and the switch table live in the README: [English](https://github.com/Kreston8/xiaoldao/blob/main/android/README.md) · [中文](https://github.com/Kreston8/xiaoldao/blob/main/android/README.zh.md)

          ## 中文

          **这个包是什么**
          小灵岛是一个 Android 通知岛：屏幕顶部一颗黑色胶囊，为消息、验证码、取件码、快递、来电、闹钟和网易云音乐（带逐行歌词）弹开；桌面上还有一个更小的常驻药丸，显示时钟、气温和天气。纯 Java，两个 overlay 窗口，没有 WebView。

          **本次更新**
          - **图标第三版。** 桌面图标中间的胶囊更扁了（图里 46×28），原来贴在胶囊两侧的两条 HUD 横线删掉了，眼睛也不再是带光晕的圆点，而是和应用里那颗岛一样的竖向药丸：每只 6.6×9.6、中心间距 13、白色带冷色描边——图标和 App 终于画的是同一张脸。
          - **退出应用之后，岛能自己回来了。** 任务被划掉时（`onTaskRemoved`），以及开关还开着、服务却被销毁时，除了原来那条 15 分钟的看门狗，还会多排一个持久化的一次性 `JobScheduler` 任务，10 秒后跑一次，所以「把应用划掉 → 桌面上的岛回来」通常只要几秒，而不是最长十几分钟。前台服务通知也标成了 `FOREGROUND_SERVICE_IMMEDIATE`，让服务状态从第一秒就是真的——那正是厂商杀手盯得最紧的时候。「后台常驻」卡片上多了一个「打开『自启动』设置」按钮，直接跳到 MIUI 的自启动页（ROM 藏起来时退回应用详情页）。
          - **天气不再时好时坏地空着。** 成功拿到一次读数（气温、WMO 代码、AQI、解析到的地名和坐标，连城市名和抓取时间一起）就写进本机，所以进程被杀之后先显示上次的数字，而不是空着等重抓；超过 12 小时的记录自动丢掉。坐标同时复用，平常一次刷新只需一个请求而不是两个；失败后按 90 秒 → 3 分钟 → 10 分钟 → 30 分钟逐级退避，不再固定 90 秒；只答了一半（有气温没 AQI）时保留旧值，而不是把已有数字清空。

          **支持的系统** — Android 8.0 及以上，按 Android 14 编译。只有一个通用安装包：纯 Java、没有 `lib/`。主要适配小米 / 红米 / POCO 的 MIUI 12–14 与 HyperOS；MIUI 还需开启「后台弹出界面」，而想让小灵岛在你退出应用后继续活着，还要开「自启动」并把「省电策略」设为无限制——设置页里新加的那个按钮就是直接跳到自启动页的。要提前知道的限制：Android 12 起默认禁止后台启动前台服务，所以看门狗放在 `JobScheduler` 任务里、10 秒那个任务做成持久化的、打开应用时也会顺手把岛拉起来；但「强行停止」仍会清掉一切，应用排的任何任务都活不过它，这是系统的设计；待办卡片直接读小米笔记、需要 root，因为它不提供 provider；Open-Meteo 的地理编码没有收录国内每一个区，所以界面上会把解析结果显示出来让你自己核对；短信卡片打开的是会话，不是某一条。只访问四个域名，且只在用到时才访问：geocoding-api.open-meteo.com / api.open-meteo.com / air-quality-api.open-meteo.com（手填城市才会连）与 music.163.com（联网歌词）。权限、限制和开关说明都在 README：[中文](https://github.com/Kreston8/xiaoldao/blob/main/android/README.zh.md) · [English](https://github.com/Kreston8/xiaoldao/blob/main/android/README.md)
          NOTES
          echo "Publishing $TAG"
          gh release create "$TAG" dist/*.apk --title "小灵岛 $TAG" --notes-file notes.md \
            || gh release upload "$TAG" dist/*.apk --clobber
