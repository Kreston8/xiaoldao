name: Build Android APK

# One universal APK, built and signed on every push that touches android/**, then published as a release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (leave empty for xiaoldao-v2.16.<run number>)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Ensure SDK platform
        run: |
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMAN" ]; then
            "$SDKMAN" --install "platforms;android-34" "build-tools;34.0.0" || true
          fi
          ls "$ANDROID_HOME/platforms"

      - name: Restore the pinned signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/xiaoldao.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/xiaoldao.p12" >> "$GITHUB_ENV"
            echo "Pinned key restored: the APK installs over previous versions."
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret, falling back to the debug key. This APK needs a clean install."
          fi

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # versionCode = 1000 + run number, so a build from this repo always updates an islandcn build.
          VERSION_CODE=$((1000 + ${{ github.run_number }}))
          gradle assembleRelease --no-daemon --stacktrace \
            -PversionCode="$VERSION_CODE" \
            -PversionName="2.16.${{ github.run_number }}"

      # Advisory only: the artifact is verified locally afterwards, this just says which key signed it.
      - name: Check the signing certificate
        continue-on-error: true
        run: |
          APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee cert.txt || true
          if grep -q "CN=Android Debug" cert.txt 2>/dev/null; then
            echo "::warning::APK is debug-signed; it cannot update an earlier pinned-key build."
          fi

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
          "dist/xiaoldao-2.16.${{ github.run_number }}.apk"
          ls -l dist
          unzip -l dist/*.apk | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: xiaoldao-apk
          path: dist/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="xiaoldao-v2.16.${{ github.run_number }}"; fi
          cat > notes.md <<'NOTES'
          ## English

          **What this build is**
          小灵岛 (xiaoldao) is a notification island for Android: a black pill at the top of the screen that opens for messages, verification codes, pickup codes, deliveries, calls, alarms and the 网易云音乐 player with line-by-line lyrics, plus a small standby pill on the home screen with the clock, the temperature and the weather. Plain Java, two overlay windows, no WebView.

          **What is new in this build**
          - **The running-state card now has the same layout as the 后台常驻 card**: folded header, one status line under it, two buttons side by side (启动 / 停止 · 预览), so the two cards line up instead of looking like they came from two different apps.
          - **The switch now remembers what you asked for.** Leaving the app no longer leaves the island off, and reopening it no longer shows 未运行 and waits for a second tap: if the switch is on and the service is gone, the app starts it again on resume and says 正在恢复 while it does. A fourth keep-alive layer — a persisted `JobScheduler` job — runs the same watchdog inside a component Android 12 and newer actually allow to start a foreground service.
          - **The Bluetooth battery feature is deleted, not hidden.** Android has no public API for accessory battery: `BATTERY_LEVEL_CHANGED` needs `BLUETOOTH_PRIVILEGED`, classic-only earbuds only answer over a vendor protocol, and the Huawei Watch GT3 Pro only reports inside 华为运动健康. Instead of chips that may never show a number, the whole thing is gone: no chips, no permission row, and no `BLUETOOTH_CONNECT` / `BLUETOOTH_SCAN` permissions at all.
          - **New icon: black, quiet, techy.** A near-black tile, a neon capsule ring fading from cyan to violet, and two glowing eyes. Drawn from scratch for this app.
          - **The name is now 小灵岛 / xiaoldao** everywhere: launcher label, repository, release tags.
          - **The colour row has a custom colour.** The last swatch opens hue / saturation / brightness sliders, so any colour can be picked instead of only the presets.

          **Supported systems** — Android 8.0 and newer, built against Android 14. One universal APK: plain Java, no `lib/`. Reference family: 小米 / 红米 / POCO on MIUI 12-14 or HyperOS; MIUI also needs 后台弹出界面, and for 小灵岛 to survive leaving the app it needs 自启动 with an unrestricted 省电策略. Limits worth knowing: Android 12 and newer normally forbids starting a foreground service from the background, which is why the watchdog lives in a `JobScheduler` job and why opening the app also restarts the island — a force-stop still cancels everything, that is the system's design; 待办 cards read 小米笔记 directly and need root, because it publishes no provider; Open-Meteo's geocoder does not list every Chinese district, which is why the resolved label is printed for you to check; and an SMS card opens the conversation, not one single message. Four hosts are reached, and only when used: geocoding-api.open-meteo.com / api.open-meteo.com / air-quality-api.open-meteo.com for the typed city, music.163.com for lyrics. Permissions, limits and the switch table live in the README: [English](https://github.com/Kreston8/xiaoldao/blob/main/android/README.md) · [中文](https://github.com/Kreston8/xiaoldao/blob/main/android/README.zh.md)

          ## 中文

          **这个包是什么**
          小灵岛是一个 Android 通知岛：屏幕顶部一颗黑色胶囊，为消息、验证码、取件码、快递、来电、闹钟和网易云音乐（带逐行歌词）弹开；桌面上还有一个更小的常驻药丸，显示时钟、气温和天气。纯 Java，两个 overlay 窗口，没有 WebView。

          **本次更新**
          - **运行状态卡换成了和「后台常驻」一样的布局**：同样的折叠标题、同样一行状态、同样并排两个按钮（启动 / 停止 · 预览），两张卡终于对齐，不再像是两个程序里的东西。
          - **开关会记住你要的是什么。** 退出应用不再等于把岛关掉，再进应用也不会显示「未运行」等你点第二次：开关是开着的、服务却没了，进应用就自动把它拉起来，并显示「正在恢复」。另外加了一层 watchdog —— 一个持久化的 `JobScheduler` 任务，把同样的保活检查放进了 Android 12 及以上真正允许启动前台服务的组件里。
          - **蓝牙电量功能整个删掉了，不是隐藏。** Android 没有公开的配件电量 API：`BATTERY_LEVEL_CHANGED` 需要 `BLUETOOTH_PRIVILEGED`；只有经典蓝牙的耳机只在自己的私有协议里报电量；华为 Watch GT3 Pro 只在华为运动健康里显示。与其给你一排可能永远没有数字的芯片，不如整块拿掉：没有芯片、没有权限行，`BLUETOOTH_CONNECT` / `BLUETOOTH_SCAN` 两个权限也从清单里删了。
          - **新图标：黑底、安静、有科技感。** 近黑底色，一颗从青到紫的霓虹胶囊环，两只发光的眼睛，全部为这个 App 现画。
          - **名字统一成「小灵岛 / xiaoldao」**：桌面名称、仓库名、发布 tag 全改。
          - **颜色条多了自定义颜色。** 最后一个色块点开是色相 / 饱和度 / 亮度三条滑杆，可以选任意颜色，不再只能用预设。

          **支持的系统** — Android 8.0 及以上，按 Android 14 编译。只有一个通用安装包：纯 Java、没有 `lib/`。主要适配小米 / 红米 / POCO 的 MIUI 12–14 与 HyperOS；MIUI 还需开启「后台弹出界面」，而想让小灵岛在你退出应用后继续活着，还要开「自启动」并把「省电策略」设为无限制。要提前知道的限制：Android 12 起默认禁止后台启动前台服务，所以 watchdog 放在 `JobScheduler` 任务里，打开应用时也会顺手把岛拉起来——但「强行停止」仍会清掉一切，这是系统的设计；待办卡片直接读小米笔记的数据库、需要 root，因为它不提供 provider；Open-Meteo 的地理编码没有收录国内每一个区，所以界面上会把解析结果显示出来让你自己核对；短信卡片打开的是会话，不是某一条。只访问四个域名，且只在用到时才访问：geocoding-api.open-meteo.com / api.open-meteo.com / air-quality-api.open-meteo.com（手填城市才会连）与 music.163.com（联网歌词）。权限、限制和开关说明都在 README：[中文](https://github.com/Kreston8/xiaoldao/blob/main/android/README.zh.md) · [English](https://github.com/Kreston8/xiaoldao/blob/main/android/README.md)
          NOTES
          echo "Publishing $TAG"
          gh release create "$TAG" dist/*.apk --title "小灵岛 $TAG" --notes-file notes.md \
            || gh release upload "$TAG" dist/*.apk --clobber
